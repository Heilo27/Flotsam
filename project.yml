# Single description of the app target (ADR-0012). Flotsam.xcodeproj is generated by bin/bootstrap.sh and gitignored.
# No team ID or signing identity is committed; release signing is injected outside the repo.
name: Flotsam
options:
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
packages:
  FlotsamCore:
    path: Packages/FlotsamCore
targets:
  Flotsam:
    type: application
    platform: macOS
    sources:
      - App/Flotsam
      - App/Platform
      - path: LICENSE
        buildPhase: resources
    dependencies:
      - package: FlotsamCore
        product: FlotsamBase
      - package: FlotsamCore
        product: FlotsamStorage
      - package: FlotsamCore
        product: FlotsamPayload
      - package: FlotsamCore
        product: FlotsamPaste
      - package: FlotsamCore
        product: FlotsamCapture
      - package: FlotsamCore
        product: FlotsamScreenshots
      - package: FlotsamCore
        product: FlotsamLibrary
      - package: FlotsamCore
        product: FlotsamShortcuts
      - package: FlotsamCore
        product: FlotsamTriggers
      - package: FlotsamCore
        product: FlotsamShelf
      - package: FlotsamCore
        product: FlotsamMCP
      # The stdio helper an AI app launches (FRD-010, ADR-0013). Embedded beside the app's own executable.
      - target: flotsam-mcp
        embed: true
        codeSign: true
        copy:
          destination: executables
    info:
      path: App/Flotsam/Info.plist
      properties:
        CFBundleName: Flotsam
        CFBundleDisplayName: Flotsam
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSUIElement: true
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        NSHumanReadableCopyright: "MIT License"
    entitlements:
      # Not sandboxed (ADR-0001, PRD): CGEventTap, Accessibility paste-back and arbitrary screenshot folders need it.
      path: App/Flotsam/Flotsam.entitlements
      properties: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.heilo27.Flotsam
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  # `flotsam-mcp`: a byte relay from standard input and output to the app's local socket. Links FlotsamBase only: no
  # database, no clips, no network code (ADR-0013).
  flotsam-mcp:
    type: tool
    platform: macOS
    sources:
      - App/MCPHelper
    dependencies:
      - package: FlotsamCore
        product: FlotsamBase
    settings:
      base:
        PRODUCT_NAME: flotsam-mcp
        PRODUCT_BUNDLE_IDENTIFIER: io.github.heilo27.Flotsam.mcp
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
schemes:
  Flotsam:
    build:
      targets:
        Flotsam: all
    run:
      config: Debug
